# Blat pod konkretne urządzenia, z wymiarami z dokumentacji producentów:
#
#   płyta gazowa   Solgaz Optimex 2+1, montaż nakładany, pionowo
#                  palniki jeden za drugim, sterowanie z przodu, wylot spalin z tyłu
#                  (widok z góry, rys. 1.5 instrukcji) - stąd 330 w poprzek, 517 w głąb
#                  wycięcie 315 x 495 mm ±1, naroża ostre (instrukcja, rys. 5.1, s. 36)
#                  min. 150 mm od boku szafki/narożnika, min. 38 mm od frontu
#   zlewozmywak    Primagran Wenecja Easy 40, podwieszany, jednokomorowy
#                  wycięcie 310 x 390 mm, naroża R20 (szablon Undermount Easy)
#                  komora 320 x 400 mm; 90/80 mm z tyłu/przodu to założenia dla blatu 600-620 mm
#   bateria        Primagran Flex 6020 - otwór Ø35 mm
#   dozownik       Primagran Slim 500 ml - otwór Ø35 mm
#
# Rozmieszczenie: płyta dosunięta w lewo i wyśrodkowana w głąb, zlew przy
# prawej i przedniej krawędzi, bateria z dozownikiem wyśrodkowane nad zlewem.
# Między płytą a zlewem zostaje 525 mm wolnego blatu na całej głębokości.

version: 1

countertop:
  name: Blat kuchenny 1400 x 1000
  width: 1400
  depth: 1000
  thickness: 20

cutouts:
  - id: plyta
    label: Solgaz Optimex 2+1
    x: 150          # min. 150 mm od boku szafki / narożnika wg instrukcji
    y: 252.5        # wyśrodkowane w głąb blatu
    width: 315      # w poprzek blatu
    height: 495     # w głąb blatu

  - id: zlew
    label: Wenecja Easy 40
    x: 990          # 100 mm od prawej krawędzi
    y: 530          # 80 mm od krawędzi przedniej - wg założeń szablonu
    width: 310
    height: 390
    cornerRadius: 20   # R20 wg szablonu Primagran

holes:
  - id: bateria
    label: Bateria Flex 6020
    x: 1085         # para otworów wyśrodkowana nad komorą zlewu
    y: 460          # 70 mm za wycięciem zlewu
    diameter: 35

  - id: dozownik
    label: Dozownik Slim 500
    x: 1205         # 120 mm w prawo od baterii
    y: 460
    diameter: 35

services:
  - service: top-mount-cutout
    target: plyta
  - service: undermount-cutout
    target: zlew
  - service: tap-hole
    target: bateria
  - service: soap-dispenser-hole
    target: dozownik

notes:
  - Krawędź tylna przylega do ściany - bez wykończenia i bez obróbki naroży tylnych.
  - Płyta pionowo - sterowanie z przodu, wylot spalin z tyłu; wycięcie 315 x 495 mm ±1, naroża ostre.
  - Płyta nakładana wg instrukcji - leży na blacie na uszczelce, obrys 330 x 517 mm. Bez wpustu.
  - Producent nie wymaga mocowania płyty i odradza stosowanie klejów oraz silikonu.
  - Płyta 150 mm od lewej krawędzi - dokładnie minimum wymagane przy szafce na blacie lub narożniku.
  - Zlew - wycięcie 310 x 390 mm, naroża R20; 80 mm od frontu to założenie szablonu dla blatu 600/620.
  - Otwory Ø35 wg kart katalogowych; kołnierz dozownika ma Ø40, otworu nie wolno powiększać.

checks:
  minEdgeDistance: 50
  minFeatureDistance: 50

drawing:
  language: pl
  scale: auto
  sheet: a3

metadata:
  project: Blat 1400 x 1000 - Solgaz Optimex 2+1 / Wenecja Easy 40
  drawnBy: SlabSketch
  revision: A
