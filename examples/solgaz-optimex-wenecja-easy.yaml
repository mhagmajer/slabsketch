# Blat pod konkretne urządzenia, z wymiarami z dokumentacji producentów:
#
#   materiał       granit Shivakashi 2 cm, Lapis Gold
#   płyta gazowa   Solgaz Optimex 2+1, montaż nakładany, pionowo
#                  palniki jeden za drugim, sterowanie z przodu, wylot spalin z tyłu
#                  (widok z góry, rys. 1.5 instrukcji) - stąd 330 w poprzek, 517 w głąb
#                  wycięcie 315 x 495 mm ±1, naroża ostre (instrukcja, rys. 5.1, s. 36)
#                  min. 150 mm od boku szafki/narożnika, min. 38 mm od frontu
#   zlewozmywak    Primagran Wenecja Easy 40, podwieszany, jednokomorowy
#                  wycięcie 310 x 390 mm, naroża R20 (szablon Undermount Easy)
#                  komora 320 x 400 mm; 90/80 mm z tyłu/przodu to założenia dla blatu 600-620 mm
#   bateria        Primagran Flex 6020 - otwór Ø35 mm
#   dozownik       Primagran Slim 500 ml - otwór Ø35 mm
#
# Rozmieszczenie z pomiaru: płyta 40 mm od lewej ściany, zlew 45 mm od prawej,
# bateria na osi komory, dozownik po jej lewej stronie - od strony przestrzeni
# roboczej, bo z prawej zostaje tylko 45 mm do ściany.
# Między płytą a zlewem zostaje 695 mm wolnego blatu na całej głębokości.

version: 1

countertop:
  name: Blat kuchenny 1405 x 710
  width: 1405
  depth: 710
  thickness: 20
  material: Granit Shivakashi, Lapis Gold
  # Co blat zastaje po każdej stronie. Krawędź stykająca się z czymkolwiek nie
  # jest widoczna, nie wymaga wykończenia i musi być szablonowana na miejscu.
  edges:
    back: wall
    left: wall
    right: wall
    front: open

cutouts:
  - id: plyta
    label: Płyta nakładana
    product: Gazowa płyta ceramiczna Solgaz Optimex 2+1
    x: 40           # z pomiaru; producent wymaga 150 mm - patrz uwagi
    y: 100          # 100 mm od ściany, 115 mm materiału przed wycięciem
    width: 315      # w poprzek blatu
    height: 495     # w głąb blatu

  - id: zlew
    label: Zlew podwieszany
    product: Zlewozmywak podwieszany jednokomorowy 40 cm Wenecja Easy
    x: 1050         # 45 mm od prawej ściany, z pomiaru
    y: 260          # 60 mm od krawędzi przedniej
    width: 310
    height: 390
    cornerRadius: 20   # R20 wg szablonu Primagran

holes:
  - id: bateria
    label: Bateria
    product: Bateria kuchenna z elastyczną wylewką Flex 6020 Primagran
    x: 1205         # na osi komory zlewu
    y: 200          # 60 mm za wycięciem zlewu
    diameter: 35

  - id: dozownik
    label: Dozownik
    product: Dozownik do płynu Slim 500 ml Primagran
    x: 1085         # 120 mm w lewo od baterii, od strony przestrzeni roboczej
    y: 200
    diameter: 35

services:
  - service: hob-cutout
    target: plyta
  - service: undermount-cutout
    target: zlew
  - service: tap-hole
    target: bateria
  - service: soap-dispenser-hole
    target: dozownik

notes:
  - Obrys z pomiaru na miejscu - blat wchodzi między ściany z trzech stron.
  - Wykończenie tylko krawędzi frontowej; tył i boki niewidoczne, bez obróbki.
  - Płyta nakładana, bez wpustu; wycięcie z tolerancją ±1 mm, naroża ostre.
  - Kołnierz płyty zakrywa cięcie tylko o 7,5 mm z boków - krawędź cięcia musi być równa.
  - Wąskie pasy kamienia - przy zlewie 45 mm z prawej, 60 z przodu, 42 z tyłu; przy płycie 40 mm.
  - Płyta 40 mm od ściany zamiast 150 mm wymaganych przez Solgaz - świadoma decyzja inwestora.
  - Otworów Ø35 nie powiększać - kołnierz dozownika ma tylko Ø40.
  - Do uzupełnienia - profil krawędzi frontowej i wykończenie powierzchni.

checks:
  minEdgeDistance: 50
  minFeatureDistance: 50

drawing:
  language: pl
  scale: auto
  sheet: a3

metadata:
  # Po pomiarze wpisz datę w surveyedOn i podbij revision - baner nad uwagami
  # zmieni się z rysunku wstępnego na wykonawczy.
  status: for-fabrication
  surveyedOn: 2026-09-09
  project: Blat 1405 x 710 - Solgaz Optimex 2+1 / Wenecja Easy 40
  drawnBy: SlabSketch
  revision: A
