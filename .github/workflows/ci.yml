name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push supersedes the run in progress for the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Development runs TypeScript straight through Node's type stripping,
        # which needs 22.18 or newer. The published package is plain JavaScript.
        node: ['22.x', '24.x']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Lint and check formatting
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Render every example
        run: npm run example

      - name: Run the built CLI, not just the sources
        run: |
          node dist/cli.js render examples/kitchen-countertop.yaml -o "$RUNNER_TEMP/built.svg"
          node dist/cli.js render examples/blat-kuchenny.yaml --lang pl -f pdf -o "$RUNNER_TEMP/built.pdf"
          head -c 8 "$RUNNER_TEMP/built.pdf" | grep -q '%PDF-1.4'
          grep -q '<svg ' "$RUNNER_TEMP/built.svg"

      - name: Fail on an unclean tree
        run: git diff --exit-code
